<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru</title>
    <!-- 1. MENGKAITKAN KE CSS UTAMA: 
         Ganti "style.css" di bawah ini dengan nama file CSS yang Anda gunakan di halaman utama/login Anda -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

<div class="register-container"> 
        <div class="login-box">
        
            <div class="header-box">
                <h2>Mulai Bersama</h2>
                <p>Silakan lengkapi formulir pendaftaran di bawah ini.</p>
            </div>

            <form id="registerForm">
  
                <div class="input-group">
                    <label for="nama">Nama Lengkap</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="username" name="username" placeholder="Buat username baru" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-field-wrapper">
                        <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field-wrapper">
                        <input type="password" id="password" name="password" placeholder="Buat password" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="konfirmasi_password">Konfirmasi Password</label>
                    <div class="input-field-wrapper">
                        <input type="password" id="konfirmasi_password" name="konfirmasi_password" placeholder="Ulangi password" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Daftar Akun</button>

            </form>

            <div class="form-footer">
                <p>Sudah punya akun? <a href="index.html">Login di sini</a></p>
                <p style="margin-top: 15px;"><a href="../index.html">&larr; Kembali ke Beranda Utama</a></p>
            </div>
        </div>
    </div>

</div>

    <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah error 405 di GitHub Pages
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const nama = document.getElementById('nama').value;
        const email = document.getElementById('email').value;
        const konfirmasi = document.getElementById('konfirmasi_password').value;

        if (password !== konfirmasi) {
            alert("Konfirmasi password tidak cocok!");
            return;
        }

        // Menyimpan data ke LocalStorage browser
        const userData = { nama, username, email, password };
        localStorage.setItem(username, JSON.stringify(userData));

        alert("Pendaftaran berhasil! Silakan login.");
        window.location.href = "index.html"; // Berpindah ke halaman login
    });
    </script>
</body>
</html>
